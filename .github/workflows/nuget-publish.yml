name: nuget-publish

on:
  workflow_call:
    inputs:
      pack-targets:
        required: false
        type: string
      solution:
        required: false
        type: string
      dotnet-version:
        type: string
        default: "11.0.x"
      packages-auth:
        type: boolean
        default: false
      build-height:
        type: string
        default: ""
      build-sha:
        type: string
        default: ""
      artifact:
        type: string
        default: ""
    secrets:
      PACKAGES_PAT:
        required: false
    outputs:
      packages:
        value: ${{ jobs.pack-push.outputs.packages }}

jobs:
  pack-push:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: nupkgs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.artifact == ''
        with:
          fetch-depth: 0

      - name: Export build identity
        if: inputs.artifact == '' && (inputs.build-height != '' || inputs.build-sha != '')
        env:
          IN_HEIGHT: ${{ inputs.build-height }}
          IN_SHA: ${{ inputs.build-sha }}
        run: |
          set -euo pipefail
          if [ -n "$IN_HEIGHT" ]; then
            echo "BUILD_HEIGHT=$IN_HEIGHT" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_SHA" ]; then
            echo "BUILD_SHA=$IN_SHA" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: inputs.artifact == ''
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: preview

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: inputs.artifact == ''
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        if: inputs.artifact == '' && inputs.packages-auth
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Pack
        if: inputs.artifact == ''
        run: |
          set -euo pipefail
          targets=$(printf '%s' "${{ inputs.pack-targets }}" | sed '/^[[:space:]]*$/d')
          solution="${{ inputs.solution }}"
          mkdir -p nupkgs
          if [ -n "$targets" ]; then
            dotnet new sln -n pack-targets -o pack-targets-sln
            while IFS= read -r proj; do
              [ -z "$proj" ] && continue
              dotnet sln pack-targets-sln/pack-targets.slnx add "$proj"
            done <<< "$targets"
            dotnet pack pack-targets-sln/pack-targets.slnx -c Release -o nupkgs
          elif [ -n "$solution" ]; then
            dotnet pack "$solution" -c Release -o nupkgs
          else
            echo "nuget-publish needs either pack-targets or solution" >&2
            exit 1
          fi

      - name: List packages
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(nupkgs/*.nupkg)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          PACKAGES=$(for f in "${files[@]}"; do basename "$f"; done | jq -Rnc '[inputs | select(test("^(.+)\\.([0-9]+\\.0\\.0)\\.nupkg$")) | capture("^(?<id>.+)\\.(?<version>[0-9]+\\.0\\.0)\\.nupkg$")]')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Upload packages
        if: inputs.artifact == '' && steps.list.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          retention-days: 1
          if-no-files-found: ignore

      - name: Push to GitHub Packages
        if: steps.list.outputs.count != '0'
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ github.token }}" \
            --skip-duplicate
