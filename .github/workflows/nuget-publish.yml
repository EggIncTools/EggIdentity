name: nuget-publish

on:
  workflow_call:
    inputs:
      pack-targets:
        required: false
        type: string
      solution:
        required: false
        type: string
      dotnet-version:
        type: string
        default: "11.0.x"
      packages-auth:
        type: boolean
        default: false
    secrets:
      PACKAGES_PAT:
        required: false

jobs:
  pack-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: preview

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        if: inputs.packages-auth
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Pack
        run: |
          set -euo pipefail
          targets=$(printf '%s' "${{ inputs.pack-targets }}" | sed '/^[[:space:]]*$/d')
          solution="${{ inputs.solution }}"
          if [ -n "$targets" ]; then
            dotnet new sln -n pack-targets -o pack-targets-sln
            while IFS= read -r proj; do
              [ -z "$proj" ] && continue
              dotnet sln pack-targets-sln/pack-targets.slnx add "$proj"
            done <<< "$targets"
            dotnet pack pack-targets-sln/pack-targets.slnx -c Release -o nupkgs
          elif [ -n "$solution" ]; then
            dotnet pack "$solution" -c Release -o nupkgs
          else
            echo "nuget-publish needs either pack-targets or solution" >&2
            exit 1
          fi

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ github.token }}" \
            --skip-duplicate
