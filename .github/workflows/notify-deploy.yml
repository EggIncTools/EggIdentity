name: notify-deploy

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      hook-url:
        description: Public URL of the identity host. The job posts to <hook-url>/hooks/image-pushed.
        type: string
        required: true
      digest:
        type: string
        required: true
      revision:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      hook-secret:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify identity host
        env:
          APP: ${{ inputs.app }}
          HOOK_URL: ${{ inputs.hook-url }}
          DIGEST: ${{ inputs.digest }}
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
          HOOK_SECRET: ${{ secrets.hook-secret }}
        run: |
          set -euo pipefail
          BODY=$(printf '{"app":"%s","digest":"%s","revision":"%s","version":"%s"}' "$APP" "$DIGEST" "$REVISION" "$VERSION")
          STATUS=$(curl -sS --max-time 30 -o /tmp/notify-deploy.out -w '%{http_code}' -X POST "${HOOK_URL%/}/hooks/image-pushed" \
            -H "Authorization: Bearer $HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY") || STATUS="000"
          echo "identity host responded $STATUS"
          cat /tmp/notify-deploy.out || true
          case "$STATUS" in
            2*)
              echo "notified $APP at $VERSION" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::warning title=Deploy hook not delivered::$APP $VERSION - identity host responded $STATUS. The image is published; deploy it from the hub or re-run this job."
              {
                echo "### Deploy hook not delivered"
                echo ""
                echo "\`$APP\` \`$VERSION\` - identity host responded \`$STATUS\`."
                echo ""
                echo "The image published successfully. Only the notification failed. Deploy it from the hub's"
                echo "fleet panel, or re-run this job."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
