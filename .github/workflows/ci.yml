name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    uses: ./.github/workflows/build-identity.yml

  test:
    needs: identity
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      solution: EggIdentity.slnx
      dotnet-version: "11.0.x"
      format-gate: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
      pack: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      publish-project: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && 'EggIdentity.Host/EggIdentity.Host.csproj' || '' }}

  pack:
    needs: [identity, test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/nuget-publish.yml
    with:
      artifact: nupkgs

  image:
    needs: [identity, test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/docker-publish.yml
    with:
      artifact: publish-output
      context: publish-output
      dockerfile: EggIdentity.Host/Dockerfile
      cache-scope: identity-host
      tags-mode: commit
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}

  notify-packages:
    needs: [identity, pack]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/notify-deploy.yml
    with:
      app: eggidentity
      hook-url: https://id.egginc.tools
      hook-path: /hooks/packages-published
      revision: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      height: ${{ needs.identity.outputs.height }}
      packages: ${{ needs.pack.outputs.packages }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}

  notify:
    needs: [identity, pack, image]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/notify-deploy.yml
    with:
      app: eggidentity
      hook-url: https://id.egginc.tools
      digest: ${{ needs.image.outputs.digest }}
      revision: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      height: ${{ needs.identity.outputs.height }}
      packages: ${{ needs.pack.outputs.packages }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
