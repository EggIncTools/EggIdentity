name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  pack:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      dotnet-version: "10.0.x"
      pack-targets: |
        EggIdentity.Contract/EggIdentity.Contract.csproj
        EggIdentity.Db/EggIdentity.Db.csproj
        EggIdentity.Deploy/EggIdentity.Deploy.csproj
        EggIdentity.Deploy.AdminUi/EggIdentity.Deploy.AdminUi.csproj
        EggIdentity.Auth/EggIdentity.Auth.csproj
        EggIdentity.Bot/EggIdentity.Bot.csproj
        EggIdentity.Bot.AdminUi/EggIdentity.Bot.AdminUi.csproj
        EggIdentity.CodeStyle/EggIdentity.CodeStyle.csproj
        EggIdentity.Config/EggIdentity.Config.csproj
        EggIdentity.Fallback/EggIdentity.Fallback.csproj
        EggIdentity.Filtering/EggIdentity.Filtering.csproj
        EggIdentity.Icons/EggIdentity.Icons.csproj
        EggIdentity/EggIdentity.csproj
        EggIdentity.Client/EggIdentity.Client.csproj
        EggIdentity.AdminUi/EggIdentity.AdminUi.csproj
        EggIdentity.Metrics/EggIdentity.Metrics.csproj
        EggIdentity.Metrics.AdminUi/EggIdentity.Metrics.AdminUi.csproj
        EggIdentity.Resilience/EggIdentity.Resilience.csproj
        EggIdentity.Settings/EggIdentity.Settings.csproj
        EggIdentity.Settings.Store/EggIdentity.Settings.Store.csproj
        EggIdentity.Settings.AdminUi/EggIdentity.Settings.AdminUi.csproj
        EggIdentity.Styles/EggIdentity.Styles.csproj
        EggIdentity.StyleVerify/EggIdentity.StyleVerify.csproj
        EggIdentity.UI/EggIdentity.UI.csproj

  docker-identity-host:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-suffix: ""
      context: .
      dockerfile: EggIdentity.Host/Dockerfile
      cache-scope: identity-host

  docker-agent:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-suffix: "-agent"
      context: .
      dockerfile: EggIdentity.Agent/Dockerfile
      cache-scope: agent

  notify-identity:
    needs: docker-identity-host
    uses: ./.github/workflows/notify-agent.yml
    with:
      app: eggidentity
      agent-url: https://eggidentity.davidarthurcole.me/agent
      digest: ${{ needs.docker-identity-host.outputs.digest }}
      revision: ${{ github.sha }}
      version: ${{ github.ref_name }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}

  notify-agent:
    needs: docker-agent
    uses: ./.github/workflows/notify-agent.yml
    with:
      app: eggidentity-agent
      agent-url: https://eggidentity.davidarthurcole.me/agent
      digest: ${{ needs.docker-agent.outputs.digest }}
      revision: ${{ github.sha }}
      version: ${{ github.ref_name }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
