name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  pack:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      dotnet-version: "10.0.x"
      pack-targets: |
        src/EggIdentity.Contract/EggIdentity.Contract.csproj
        src/EggIdentity.Db/EggIdentity.Db.csproj
        src/EggIdentity.Auth/EggIdentity.Auth.csproj
        src/EggIdentity.Bot/EggIdentity.Bot.csproj
        src/EggIdentity.Bot.AdminUi/EggIdentity.Bot.AdminUi.csproj
        src/EggIdentity.CodeStyle/EggIdentity.CodeStyle.csproj
        src/EggIdentity.Config/EggIdentity.Config.csproj
        src/EggIdentity.Fallback/EggIdentity.Fallback.csproj
        src/EggIdentity/EggIdentity.csproj
        src/EggIdentity.Client/EggIdentity.Client.csproj
        src/EggIdentity.AdminUi/EggIdentity.AdminUi.csproj
        src/EggIdentity.Metrics/EggIdentity.Metrics.csproj
        src/EggIdentity.Metrics.AdminUi/EggIdentity.Metrics.AdminUi.csproj
        src/EggIdentity.Styles/EggIdentity.Styles.csproj
        src/EggIdentity.StyleVerify/EggIdentity.StyleVerify.csproj
        src/EggIdentity.UI/EggIdentity.UI.csproj

  docker-identity-host:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-suffix: ""
      context: .
      dockerfile: src/EggIdentity.Host/Dockerfile
      cache-scope: identity-host

  docker-agent:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image-suffix: "-agent"
      context: .
      dockerfile: src/EggIdentity.Agent/Dockerfile
      cache-scope: agent

  fast-deploy-identity:
    uses: ./.github/workflows/fast-deploy-trigger.yml
    with:
      app: EggIdentity
      agent-url: https://eggidentity.davidarthurcole.me/agent
    secrets:
      deploy-secret: ${{ secrets.IDENTITY_DEPLOY_SECRET }}

  fast-deploy-agent:
    uses: ./.github/workflows/fast-deploy-trigger.yml
    with:
      app: eggidentity-agent
      agent-url: https://eggidentity.davidarthurcole.me/agent
    secrets:
      deploy-secret: ${{ secrets.AGENT_SELF_DEPLOY_SECRET }}
