name: dotnet-ci

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
      dotnet-version:
        type: string
        default: "11.0.x"
      packages-auth:
        type: boolean
        default: false
      format-gate:
        type: boolean
        default: false
      build-height:
        type: string
        default: ""
      build-sha:
        type: string
        default: ""
    secrets:
      PACKAGES_PAT:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Export build identity
        if: inputs.build-height != '' || inputs.build-sha != ''
        env:
          IN_HEIGHT: ${{ inputs.build-height }}
          IN_SHA: ${{ inputs.build-sha }}
        run: |
          set -euo pipefail
          if [ -n "$IN_HEIGHT" ]; then
            echo "BUILD_HEIGHT=$IN_HEIGHT" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_SHA" ]; then
            echo "BUILD_SHA=$IN_SHA" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: preview

      - name: Verify whitespace
        if: inputs.format-gate
        run: dotnet format whitespace --folder --verify-no-changes

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        if: inputs.packages-auth
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.PACKAGES_PAT || github.token }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Build
        run: dotnet build ${{ inputs.solution }} -c Release

      - name: Test
        run: dotnet test ${{ inputs.solution }} -c Release --no-build
